<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0814">
  <title>mai sync selector</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="brand">
        <span class="brand-glyph" aria-hidden="true">舞</span>
        <span class="brand-name">mai sync selector</span>
        <span class="brand-version" id="versionDisplay">—</span>
      </div>
      <div class="header-actions">
        <a class="icon-btn" href="https://github.com/Jinvic/mai_sync_selector" target="_blank" rel="noopener" aria-label="GitHub">
          <svg height="18" width="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
        </a>
        <button class="btn btn-primary" id="refreshBtn" type="button">同步数据</button>
      </div>
    </header>

    <div class="player-tabs" id="playerTabs" role="tablist" data-active="1">
      <span class="player-indicator" aria-hidden="true"></span>
      <button class="player-tab is-active" type="button" role="tab" aria-selected="true" data-tab="1">1P 筛选</button>
      <button class="player-tab" type="button" role="tab" aria-selected="false" data-tab="2">2P 筛选</button>
    </div>

    <div class="filters-viewport" id="filtersViewport" data-active="1">
      <div class="filters-track">

        <section class="filter-card" id="filter1" data-player="1">
          <div class="filter-card-head">
            <span class="filter-card-tag">1P</span>
            <h2 class="filter-card-title">筛选条件</h2>
          </div>
          <div class="filter-row">
            <span class="filter-row-label">版本 · From</span>
            <div class="chip-list" id="fromList1"></div>
          </div>
          <div class="filter-row">
            <span class="filter-row-label">曲包 · Genre</span>
            <div class="chip-list" id="genreList1"></div>
          </div>
          <div class="filter-row">
            <span class="filter-row-label">定数 · DS</span>
            <div class="range-row">
              <input type="number" class="range-input" id="minDs1" min="1.0" max="15.9" step="0.1" value="1.0" placeholder="1.0" inputmode="decimal">
              <span class="range-sep">→</span>
              <input type="number" class="range-input" id="maxDs1" min="1.0" max="15.9" step="0.1" value="15.9" placeholder="15.9" inputmode="decimal">
            </div>
          </div>
          <div class="filter-row">
            <span class="filter-row-label">等级 · Level</span>
            <div class="range-row">
              <select class="level-select" id="minLevel1" aria-label="1P 最低等级"></select>
              <span class="range-sep">→</span>
              <select class="level-select" id="maxLevel1" aria-label="1P 最高等级"></select>
            </div>
          </div>
        </section>

        <section class="filter-card" id="filter2" data-player="2">
          <div class="filter-card-head">
            <span class="filter-card-tag">2P</span>
            <h2 class="filter-card-title">筛选条件</h2>
          </div>
          <div class="filter-row">
            <span class="filter-row-label">版本 · From</span>
            <div class="chip-list" id="fromList2"></div>
          </div>
          <div class="filter-row">
            <span class="filter-row-label">曲包 · Genre</span>
            <div class="chip-list" id="genreList2"></div>
          </div>
          <div class="filter-row">
            <span class="filter-row-label">定数 · DS</span>
            <div class="range-row">
              <input type="number" class="range-input" id="minDs2" min="1.0" max="15.9" step="0.1" value="1.0" placeholder="1.0" inputmode="decimal">
              <span class="range-sep">→</span>
              <input type="number" class="range-input" id="maxDs2" min="1.0" max="15.9" step="0.1" value="15.9" placeholder="15.9" inputmode="decimal">
            </div>
          </div>
          <div class="filter-row">
            <span class="filter-row-label">等级 · Level</span>
            <div class="range-row">
              <select class="level-select" id="minLevel2" aria-label="2P 最低等级"></select>
              <span class="range-sep">→</span>
              <select class="level-select" id="maxLevel2" aria-label="2P 最高等级"></select>
            </div>
          </div>
        </section>

      </div>
    </div>

    <section class="result-card">
      <div class="result-head">
        <div class="result-title-block">
          <h2 class="result-title">命中曲目</h2>
          <span class="result-count" id="resultCount">—</span>
        </div>
        <div class="col-toggle" id="colToggle" role="group" aria-label="列显示切换">
          <button class="col-toggle-btn is-on" type="button" data-col="cover">封面</button>
          <button class="col-toggle-btn is-on" type="button" data-col="title">标题</button>
          <button class="col-toggle-btn is-on" type="button" data-col="artist">艺术家</button>
          <button class="col-toggle-btn is-on" type="button" data-col="ds">定数</button>
          <button class="col-toggle-btn is-on" type="button" data-col="level">等级</button>
          <button class="col-toggle-btn is-on" type="button" data-col="bpm">BPM</button>
          <button class="col-toggle-btn is-on" type="button" data-col="from">版本</button>
          <button class="col-toggle-btn is-on" type="button" data-col="genre">曲包</button>
          <button class="col-toggle-btn is-on" type="button" data-col="type">类型</button>
        </div>
      </div>

      <div class="table-scroll">
        <table class="song-table">
          <thead>
            <tr id="tableHeader">
              <th data-col="cover">封面</th>
              <th data-col="title">标题</th>
              <th data-col="artist">艺术家</th>
              <th data-col="ds">定数</th>
              <th data-col="level">等级</th>
              <th data-col="bpm">BPM</th>
              <th data-col="from">版本</th>
              <th data-col="genre">曲包</th>
              <th data-col="type">类型</th>
            </tr>
          </thead>
          <tbody id="songTableBody">
            <tr class="loading-row"><td colspan="9">加载中</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pagination">
        <select class="page-size-select" id="pageSizeSelect" aria-label="每页数量">
          <option value="10">10 / 页</option>
          <option value="20" selected>20 / 页</option>
          <option value="50">50 / 页</option>
          <option value="100">100 / 页</option>
        </select>
        <div class="page-controls" id="pageControls"></div>
        <span class="page-info" id="pageInfo"></span>
      </div>
    </section>

  </div>

  <script defer src="/app.js"></script>
</body>
</html>
