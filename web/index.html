<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mai_sync_selector</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-title">mai_sync_selector<span class="version" id="versionDisplay"></span></div>
      <div class="header-actions">
        <a class="github-link" href="https://github.com/Jinvic/mai_sync_selector" target="_blank" rel="noopener">
          <svg height="20" width="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
        </a>
        <button class="btn" id="refreshBtn">刷新数据</button>
      </div>
    </div>

    <div class="tab-bar" id="tabBar">
      <button class="tab-btn active" data-tab="1">1P 筛选</button>
      <button class="tab-btn" data-tab="2">2P 筛选</button>
    </div>

    <div class="filters" id="filtersArea">
      <div class="filter-panel mobile-active" id="filter1">
        <div class="filter-panel-title">1P 筛选</div>
        <div class="filter-section">
          <label class="filter-label">版本 (from)</label>
          <div class="checkbox-list" id="fromList1"></div>
        </div>
        <div class="filter-section">
          <label class="filter-label">曲包 (genre)</label>
          <div class="checkbox-list" id="genreList1"></div>
        </div>
        <div class="filter-section">
          <label class="filter-label">定数 (DS)</label>
          <div class="range-group">
            <input type="number" class="range-input" id="minDs1" min="1.0" max="15.9" step="0.1" value="1.0" placeholder="min">
            <span class="range-sep">~</span>
            <input type="number" class="range-input" id="maxDs1" min="1.0" max="15.9" step="0.1" value="15.9" placeholder="max">
          </div>
        </div>
        <div class="filter-section">
          <label class="filter-label">等级 (level)</label>
          <div class="range-group">
            <select class="level-select" id="minLevel1"></select>
            <span class="range-sep">~</span>
            <select class="level-select" id="maxLevel1"></select>
          </div>
        </div>
      </div>

      <div class="filter-panel" id="filter2">
        <div class="filter-panel-title">2P 筛选</div>
        <div class="filter-section">
          <label class="filter-label">版本 (from)</label>
          <div class="checkbox-list" id="fromList2"></div>
        </div>
        <div class="filter-section">
          <label class="filter-label">曲包 (genre)</label>
          <div class="checkbox-list" id="genreList2"></div>
        </div>
        <div class="filter-section">
          <label class="filter-label">定数 (DS)</label>
          <div class="range-group">
            <input type="number" class="range-input" id="minDs2" min="1.0" max="15.9" step="0.1" value="1.0" placeholder="min">
            <span class="range-sep">~</span>
            <input type="number" class="range-input" id="maxDs2" min="1.0" max="15.9" step="0.1" value="15.9" placeholder="max">
          </div>
        </div>
        <div class="filter-section">
          <label class="filter-label">等级 (level)</label>
          <div class="range-group">
            <select class="level-select" id="minLevel2"></select>
            <span class="range-sep">~</span>
            <select class="level-select" id="maxLevel2"></select>
          </div>
        </div>
      </div>
    </div>

    <div class="song-list-container">
      <div class="song-list-header">
        <span class="song-list-title">歌曲列表</span>
        <div class="col-toggle" id="colToggle">
          <button class="col-toggle-btn active" data-col="cover">封面</button>
          <button class="col-toggle-btn active" data-col="title">标题</button>
          <button class="col-toggle-btn active" data-col="artist">艺术家</button>
          <button class="col-toggle-btn active" data-col="ds">定数</button>
          <button class="col-toggle-btn active" data-col="level">等级</button>
          <button class="col-toggle-btn active" data-col="bpm">BPM</button>
          <button class="col-toggle-btn active" data-col="from">版本</button>
          <button class="col-toggle-btn active" data-col="genre">曲包</button>
          <button class="col-toggle-btn active" data-col="type">类型</button>
        </div>
      </div>
      <div class="table-scroll">
        <table class="song-table">
          <thead>
            <tr id="tableHeader">
              <th data-col="cover">封面</th>
              <th data-col="title">标题</th>
              <th data-col="artist">艺术家</th>
              <th data-col="ds">定数</th>
              <th data-col="level">等级</th>
              <th data-col="bpm">BPM</th>
              <th data-col="from">版本</th>
              <th data-col="genre">曲包</th>
              <th data-col="type">类型</th>
            </tr>
          </thead>
          <tbody id="songTableBody">
            <tr class="loading-row"><td colspan="9">加载中...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <select class="page-size-select" id="pageSizeSelect">
          <option value="10">每页 10 首</option>
          <option value="20" selected>每页 20 首</option>
          <option value="50">每页 50 首</option>
          <option value="100">每页 100 首</option>
        </select>
        <div class="page-controls" id="pageControls"></div>
        <span class="page-info" id="pageInfo"></span>
      </div>
    </div>
  </div>

  <script defer src="/app.js"></script>
</body>
</html>
