<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mai_sync_selector</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base: #0f0f14;
      --bg-surface: #1a1a22;
      --bg-elevated: #232330;
      --bg-hover: #2a2a3a;
      --border: rgba(255,255,255,0.08);
      --text-primary: #f0f0f5;
      --text-secondary: #9090a0;
      --text-muted: #606070;
      --accent: #a78bfa;
      --accent-hover: #c4b5fd;
      --accent-ds: #f472b6;
      --accent-level: #38bdf8;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app { max-width: 1400px; margin: 0 auto; padding: 16px; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .header-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title::before { content: "🎮"; }
    .header-title .version {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: 8px;
    }
    .btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--accent); }
    .btn:active { scale: 0.97; }
    .github-link {
      display: flex;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      transition: background 0.15s, border-color 0.15s;
    }
    .github-link:hover { background: var(--bg-hover); border-color: var(--accent); color: var(--text-primary); }
    .header-actions { display: flex; align-items: center; gap: 8px; }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    @media (max-width: 768px) {
      .filters { grid-template-columns: 1fr; }
    }

    .filter-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
    }
    .filter-panel-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .filter-section { margin-bottom: 12px; }
    .filter-section:last-child { margin-bottom: 0; }
    .filter-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: block;
    }

    .checkbox-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 120px;
      overflow-y: auto;
      padding: 4px 0;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      cursor: pointer;
      font-size: 12px;
      transition: background 0.1s, border-color 0.1s;
      user-select: none;
    }
    .checkbox-item:hover { background: var(--bg-hover); }
    .checkbox-item.checked { border-color: var(--accent); background: rgba(167,139,250,0.15); color: var(--accent-hover); }
    .checkbox-item input { display: none; }

    .range-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .range-input {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-size: 13px;
      width: 80px;
      text-align: center;
    }
    .range-input:focus { outline: none; border-color: var(--accent); }
    .range-sep { color: var(--text-muted); font-size: 13px; }
    .range-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 2px;
      background: var(--bg-elevated);
      outline: none;
    }
    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .level-select {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-size: 13px;
      min-width: 70px;
    }
    .level-select:focus { outline: none; border-color: var(--accent); }

    .song-list-container {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .song-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .song-list-title {
      font-size: 14px;
      font-weight: 600;
    }
    .col-toggle {
      display: flex;
      gap: 4px;
    }
    .col-toggle-btn {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 11px;
      transition: all 0.1s;
    }
    .col-toggle-btn:hover { color: var(--text-primary); }
    .col-toggle-btn.active { background: rgba(167,139,250,0.15); border-color: var(--accent); color: var(--accent-hover); }

    .song-table { width: 100%; border-collapse: collapse; }
    .song-table th {
      padding: 10px 12px;
      text-align: left;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .song-table td {
      padding: 8px 12px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .song-table tr:hover td { background: var(--bg-hover); }
    .song-table tr:last-child td { border-bottom: none; }

    .cover-cell {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      object-fit: cover;
    }
    .title-cell { font-weight: 500; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .artist-cell { color: var(--text-secondary); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ds-cell, .level-cell { font-variant-numeric: tabular-nums; font-size: 12px; }
    .ds-cell { color: var(--accent-ds); }
    .level-cell { color: var(--accent-level); }
    .bpm-cell, .from-cell, .genre-cell { color: var(--text-secondary); font-size: 12px; }
    .genre-cell { max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .level-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      margin: 1px;
    }
    .level-badge.basic { background: rgba(74,222,128,0.15); color: #4ade80; }
    .level-badge.advanced { background: rgba(251,191,36,0.15); color: #fbbf24; }
    .level-badge.expert { background: rgba(248,113,113,0.15); color: #f87171; }
    .level-badge.master { background: rgba(192,132,252,0.15); color: #c084fc; }
    .level-badge.re_master { background: rgba(200,200,230,0.15); color: #d4d4f0; }

    .loading-row td { text-align: center; padding: 32px; color: var(--text-muted); }
    .empty-row td { text-align: center; padding: 32px; color: var(--text-muted); }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 8px;
    }
    .page-size-select {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-size: 13px;
    }
    .page-controls { display: flex; align-items: center; gap: 4px; }
    .page-btn {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.1s;
    }
    .page-btn:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--accent); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .page-btn.active { background: rgba(167,139,250,0.2); border-color: var(--accent); color: var(--accent-hover); }
    .page-info { font-size: 12px; color: var(--text-secondary); margin-left: 8px; }

    .tab-bar {
      display: none;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .tab-bar.active { display: flex; }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: var(--bg-surface);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .tab-btn.active { background: var(--bg-elevated); color: var(--accent); }

    @media (max-width: 768px) {
      .tab-bar { display: flex; }
      .filter-panel { display: none; }
      .filter-panel.mobile-active { display: block; }
    }

    @media (max-width: 600px) {
      .song-table th:nth-child(4), .song-table td:nth-child(4),
      .song-table th:nth-child(5), .song-table td:nth-child(5) { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-title">mai_sync_selector<span class="version" id="versionDisplay"></span></div>
      <div class="header-actions">
        <a class="github-link" href="https://github.com/Jinvic/mai_sync_selector" target="_blank" rel="noopener">
          <svg height="20" width="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
        </a>
        <button class="btn" id="refreshBtn">刷新数据</button>
      </div>
    </div>

    <div class="tab-bar" id="tabBar">
      <button class="tab-btn active" data-tab="1">1P 筛选</button>
      <button class="tab-btn" data-tab="2">2P 筛选</button>
    </div>

    <div class="filters" id="filtersArea">
      <div class="filter-panel mobile-active" id="filter1">
        <div class="filter-panel-title">1P 筛选</div>
        <div class="filter-section">
          <label class="filter-label">版本 (from)</label>
          <div class="checkbox-list" id="fromList1"></div>
        </div>
        <div class="filter-section">
          <label class="filter-label">曲包 (genre)</label>
          <div class="checkbox-list" id="genreList1"></div>
        </div>
        <div class="filter-section">
          <label class="filter-label">定数 (DS)</label>
          <div class="range-group">
            <input type="number" class="range-input" id="minDs1" min="1.0" max="15.9" step="0.1" value="1.0" placeholder="min">
            <span class="range-sep">~</span>
            <input type="number" class="range-input" id="maxDs1" min="1.0" max="15.9" step="0.1" value="15.9" placeholder="max">
          </div>
        </div>
        <div class="filter-section">
          <label class="filter-label">等级 (level)</label>
          <div class="range-group">
            <select class="level-select" id="minLevel1"></select>
            <span class="range-sep">~</span>
            <select class="level-select" id="maxLevel1"></select>
          </div>
        </div>
      </div>

      <div class="filter-panel" id="filter2">
        <div class="filter-panel-title">2P 筛选</div>
        <div class="filter-section">
          <label class="filter-label">版本 (from)</label>
          <div class="checkbox-list" id="fromList2"></div>
        </div>
        <div class="filter-section">
          <label class="filter-label">曲包 (genre)</label>
          <div class="checkbox-list" id="genreList2"></div>
        </div>
        <div class="filter-section">
          <label class="filter-label">定数 (DS)</label>
          <div class="range-group">
            <input type="number" class="range-input" id="minDs2" min="1.0" max="15.9" step="0.1" value="1.0" placeholder="min">
            <span class="range-sep">~</span>
            <input type="number" class="range-input" id="maxDs2" min="1.0" max="15.9" step="0.1" value="15.9" placeholder="max">
          </div>
        </div>
        <div class="filter-section">
          <label class="filter-label">等级 (level)</label>
          <div class="range-group">
            <select class="level-select" id="minLevel2"></select>
            <span class="range-sep">~</span>
            <select class="level-select" id="maxLevel2"></select>
          </div>
        </div>
      </div>
    </div>

    <div class="song-list-container">
      <div class="song-list-header">
        <span class="song-list-title">歌曲列表</span>
        <div class="col-toggle" id="colToggle">
          <button class="col-toggle-btn active" data-col="cover">封面</button>
          <button class="col-toggle-btn active" data-col="title">标题</button>
          <button class="col-toggle-btn active" data-col="artist">艺术家</button>
          <button class="col-toggle-btn active" data-col="ds">定数</button>
          <button class="col-toggle-btn active" data-col="level">等级</button>
          <button class="col-toggle-btn active" data-col="bpm">BPM</button>
          <button class="col-toggle-btn active" data-col="from">版本</button>
          <button class="col-toggle-btn active" data-col="genre">曲包</button>
        </div>
      </div>
      <table class="song-table">
        <thead>
          <tr id="tableHeader">
            <th data-col="cover">封面</th>
            <th data-col="title">标题</th>
            <th data-col="artist">艺术家</th>
            <th data-col="ds">定数</th>
            <th data-col="level">等级</th>
            <th data-col="bpm">BPM</th>
            <th data-col="from">版本</th>
            <th data-col="genre">曲包</th>
          </tr>
        </thead>
        <tbody id="songTableBody">
          <tr class="loading-row"><td colspan="8">加载中...</td></tr>
        </tbody>
      </table>
      <div class="pagination">
        <select class="page-size-select" id="pageSizeSelect">
          <option value="10">每页 10 首</option>
          <option value="20" selected>每页 20 首</option>
          <option value="50">每页 50 首</option>
          <option value="100">每页 100 首</option>
        </select>
        <div class="page-controls" id="pageControls"></div>
        <span class="page-info" id="pageInfo"></span>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '';
    const DIFFICULTIES = ['basic', 'advanced', 'expert', 'master', 're_master'];
    const LEVELS = [];
    for (let i = 0; i <= 15; i++) {
      LEVELS.push(String(i));
      LEVELS.push(i + '+');
    }

    let state = {
      fromList: [],
      genreList: [],
      levelList: LEVELS,
      filter1: { from_list: [], genre_list: [], min_ds: 1.0, max_ds: 15.9, min_level: '', max_level: '' },
      filter2: { from_list: [], genre_list: [], min_ds: 1.0, max_ds: 15.9, min_level: '', max_level: '' },
      page: 1,
      pageSize: 20,
      total: 0,
      columns: { cover: true, title: true, artist: true, ds: true, level: true, bpm: true, from: true, genre: true }
    };

    let debounceTimer = null;

    function api(path, options = {}) {
      return fetch(API_BASE + path, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      }).then(r => r.json());
    }

    function buildFilter(player) {
      const prefix = player === 1 ? '1' : '2';
      const minDs = parseFloat(document.getElementById('minDs' + prefix).value) || 1.0;
      const maxDs = parseFloat(document.getElementById('maxDs' + prefix).value) || 15.9;
      return {
        from_list: Array.from(document.querySelectorAll('#fromList' + prefix + ' .checkbox-item.checked')).map(el => el.dataset.value),
        genre_list: Array.from(document.querySelectorAll('#genreList' + prefix + ' .checkbox-item.checked')).map(el => el.dataset.value),
        min_ds: minDs,
        max_ds: maxDs,
        min_level: document.getElementById('minLevel' + prefix).value,
        max_level: document.getElementById('maxLevel' + prefix).value
      };
    }

    function fetchSongs() {
      const body = {
        filter1: buildFilter(1),
        filter2: buildFilter(2),
        page: state.page,
        page_size: state.pageSize
      };
      document.getElementById('songTableBody').innerHTML = '<tr class="loading-row"><td colspan="8">加载中...</td></tr>';
      api('/select-song', { method: 'POST', body: JSON.stringify(body) })
        .then(data => {
          if (data.status === 1 && data.data) {
            state.total = data.data.total;
            renderSongList(data.data.song_list);
            renderPagination();
          } else {
            const errMsg = data.msg || data.error || JSON.stringify(data);
            document.getElementById('songTableBody').innerHTML = '<tr class="empty-row"><td colspan="8">加载失败: ' + errMsg + '</td></tr>';
          }
        })
        .catch(() => {
          document.getElementById('songTableBody').innerHTML = '<tr class="empty-row"><td colspan="8">网络错误</td></tr>';
        });
    }

    function renderSongList(songs) {
      const tbody = document.getElementById('songTableBody');
      if (!songs || songs.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="8">没有找到符合条件的歌曲</td></tr>';
        return;
      }
      tbody.innerHTML = songs.map(song => {
        const dsParts = DIFFICULTIES.map(d => {
          const v = song.ds && song.ds[d];
          return v !== undefined && v !== null ? `<span class="ds-cell">${v.toFixed(1)}</span>` : '';
        }).join(' ');
        const levelParts = DIFFICULTIES.map(d => {
          const v = song.level && song.level[d];
          if (!v) return '';
          const cls = 'level-badge ' + d;
          return `<span class="${cls}">${v}</span>`;
        }).join('');
        return `<tr>
          ${col('cover', `<img class="cover-cell" src="${song.cover_url || ''}" alt="${song.title}" loading="lazy">`)}
          ${col('title', `<span class="title-cell">${song.title}</span>`)}
          ${col('artist', `<span class="artist-cell">${song.artist}</span>`)}
          ${col('ds', dsParts)}
          ${col('level', levelParts)}
          ${col('bpm', `<span class="bpm-cell">${song.bpm || '-'}</span>`)}
          ${col('from', `<span class="from-cell">${song.from || '-'}</span>`)}
          ${col('genre', `<span class="genre-cell">${song.genre}</span>`)}
        </tr>`;
      }).join('');
    }

    function col(name, content) {
      return state.columns[name] ? `<td data-col="${name}">${content}</td>` : '';
    }

    function renderPagination() {
      const totalPages = Math.ceil(state.total / state.pageSize) || 1;
      const controls = document.getElementById('pageControls');
      const info = document.getElementById('pageInfo');

      let btns = '';
      btns += `<button class="page-btn" id="prevPage" ${state.page <= 1 ? 'disabled' : ''}>上一页</button>`;
      const maxBtns = 5;
      let startPage = Math.max(1, state.page - 2);
      let endPage = Math.min(totalPages, startPage + maxBtns - 1);
      if (endPage - startPage < maxBtns - 1) startPage = Math.max(1, endPage - maxBtns + 1);
      if (startPage > 1) btns += `<button class="page-btn" data-page="1">1</button>`;
      if (startPage > 2) btns += `<span style="color:var(--text-muted)">...</span>`;
      for (let i = startPage; i <= endPage; i++) {
        btns += `<button class="page-btn ${i === state.page ? 'active' : ''}" data-page="${i}">${i}</button>`;
      }
      if (endPage < totalPages - 1) btns += `<span style="color:var(--text-muted)">...</span>`;
      if (endPage < totalPages) btns += `<button class="page-btn" data-page="${totalPages}">${totalPages}</button>`;
      btns += `<button class="page-btn" id="nextPage" ${state.page >= totalPages ? 'disabled' : ''}>下一页</button>`;
      controls.innerHTML = btns;
      info.textContent = `共 ${state.total} 首`;

      controls.querySelectorAll('.page-btn[data-page]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.page = parseInt(btn.dataset.page);
          fetchSongs();
        });
      });
      document.getElementById('prevPage')?.addEventListener('click', () => { if (state.page > 1) { state.page--; fetchSongs(); } });
      document.getElementById('nextPage')?.addEventListener('click', () => { if (state.page < totalPages) { state.page++; fetchSongs(); } });
    }

    function renderLevelSelects() {
      ['1', '2'].forEach(p => {
        const minEl = document.getElementById('minLevel' + p);
        const maxEl = document.getElementById('maxLevel' + p);
        let opts = '<option value="">不限</option>' + LEVELS.map(l => `<option value="${l}">${l}</option>`).join('');
        minEl.innerHTML = opts;
        maxEl.innerHTML = opts;
        minEl.value = '';
        maxEl.value = '';
      });
    }

    function renderCheckboxList(containerId, items, selected) {
      const container = document.getElementById(containerId);
      container.innerHTML = items.map(item => {
        const checked = selected.includes(item) ? 'checked' : '';
        return `<label class="checkbox-item ${checked}" data-value="${item}">
          <input type="checkbox" ${checked ? 'checked' : ''}>${item}
        </label>`;
      }).join('');
      container.querySelectorAll('input[type="checkbox"]').forEach(input => {
        input.addEventListener('change', () => {
          const label = input.parentElement;
          label.classList.toggle('checked', input.checked);
          triggerSearch();
        });
      });
    }

    function triggerSearch() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        state.page = 1;
        fetchSongs();
      }, 300);
    }

    function setupEventListeners() {
      ['minDs1', 'maxDs1', 'minDs2', 'maxDs2'].forEach(id => {
        document.getElementById(id).addEventListener('input', triggerSearch);
      });
      ['minLevel1', 'maxLevel1', 'minLevel2', 'maxLevel2'].forEach(id => {
        document.getElementById(id).addEventListener('change', triggerSearch);
      });

      document.getElementById('pageSizeSelect').addEventListener('change', e => {
        state.pageSize = parseInt(e.target.value);
        state.page = 1;
        fetchSongs();
      });

      document.getElementById('colToggle').querySelectorAll('.col-toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const col = btn.dataset.col;
          const wasActive = btn.classList.contains('active');
          if (wasActive) {
            btn.classList.remove('active');
            state.columns[col] = false;
            document.querySelectorAll(`th[data-col="${col}"], td[data-col="${col}"]`).forEach(el => {
              el.style.display = 'none';
            });
          } else {
            btn.classList.add('active');
            state.columns[col] = true;
            document.querySelectorAll(`th[data-col="${col}"], td[data-col="${col}"]`).forEach(el => {
              el.style.display = '';
            });
          }
        });
      });

      document.getElementById('tabBar').querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const tab = btn.dataset.tab;
          document.getElementById('filter1').classList.toggle('mobile-active', tab === '1');
          document.getElementById('filter2').classList.toggle('mobile-active', tab === '2');
        });
      });

      document.getElementById('refreshBtn').addEventListener('click', () => {
        document.getElementById('refreshBtn').textContent = '同步中...';
        api('/sync-data').then(data => {
          document.getElementById('refreshBtn').textContent = '刷新数据';
          if (data.status === 1) {
            fetchMeta();
          }
        }).catch(() => {
          document.getElementById('refreshBtn').textContent = '刷新数据';
        });
      });
    }

    function fetchMeta() {
      Promise.all([api('/version'), api('/from'), api('/genre'), api('/level')]).then(([versionData, fromData, genreData, levelData]) => {
        if (versionData.data?.version) {
          document.getElementById('versionDisplay').textContent = versionData.data.version;
        }
        state.fromList = fromData.data?.from_list || [];
        state.genreList = genreData.data?.genre_list || [];
        state.levelList = levelData.data?.level_list || LEVELS;
        renderCheckboxList('fromList1', state.fromList, []);
        renderCheckboxList('genreList1', state.genreList, []);
        renderCheckboxList('fromList2', state.fromList, []);
        renderCheckboxList('genreList2', state.genreList, []);
        renderLevelSelects();
        fetchSongs();
      }).catch(() => {
        document.getElementById('songTableBody').innerHTML = '<tr class="empty-row"><td colspan="8">加载元数据失败，请刷新页面</td></tr>';
      });
    }

    function init() {
      renderLevelSelects();
      setupEventListeners();
      fetchMeta();
    }

    init();
  </script>
</body>
</html>
